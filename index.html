<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
  <meta name="color-scheme" content="dark" />
  <script>
    // Match design/version.ts: New is the default, Current is explicit.
    // Run before styles and app loading to avoid a light flash and double-darkening.
    const initialParams = new URLSearchParams(window.location.search);
    const nativeDark = initialParams.get('design') !== 'classic' && initialParams.get('theme') !== 'light';
    document.documentElement.dataset.nativeTheme = nativeDark ? 'dark' : 'light';
    document.documentElement.style.colorScheme = nativeDark ? 'dark' : 'light';
    document.querySelector('meta[name="color-scheme"]').content = nativeDark ? 'dark' : 'light';
    if (nativeDark) {
      const lock = document.createElement('meta');
      lock.name = 'darkreader-lock';
      document.head.appendChild(lock);
    }
  </script>
  <style>
    html[data-native-theme="dark"], html[data-native-theme="dark"] body { background-color: #030d11; color: #e6f1ef; }
    html[data-native-theme="light"] { background-color: #edf3f5; color-scheme: light; }
  </style>
  <title>Rangaraju Lab | Neuroenergetics Research at Max Planck Florida</title>

  <script>
    if (new URLSearchParams(window.location.search).has('design')) {
      document.querySelector('meta[name="robots"]').content = 'noindex, follow';

  </script>

  <!-- Tailwind CSS -->

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['"Libre Baskerville"', 'serif'],
          },
          colors: {
            neuro: {

  <style>
    html {
      scroll-behavior: smooth;
    }

    section {
      scroll-margin-top: 100px;
    }

    @keyframes bio-glow {
      0% {
        text-shadow: 0 0 5px rgba(20, 184, 166, 0);
      }

      50% {
        text-shadow: 0 0 15px rgba(20, 184, 166, 0.6), 0 0 25px rgba(20, 184, 166, 0.4);
      }

      100% {
        text-shadow: 0 0 5px rgba(20, 184, 166, 0);
      }
    }

    @keyframes photo-to-back-motion {
      0% {
        transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }

      40% {
        transform: translate3d(90%, -5%, 0) scale(0.98) rotate(8deg);
        opacity: 1;
      }

      60% {
        transform: translate3d(125%, 4%, 0) scale(0.95) rotate(10deg);
        opacity: 1;
      }

      68% {
        transform: translate3d(132%, 12%, 0) scale(0.92) rotate(9deg);
        opacity: 1;
      }

      82% {
        transform: translate3d(75%, 36px, 0) scale(0.87) rotate(5deg);
        opacity: 1;
      }

      100% {
        transform: translate3d(0, 72px, 0) scale(0.8) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes photo-to-back-depth {
      0% {
        z-index: 30;
      }

      100% {
        z-index: 0;
      }
    }

    .photo-card-to-back {
      animation:
        photo-to-back-motion 900ms linear both,
        photo-to-back-depth 1ms steps(1, end) 620ms both;
    }

    @media (prefers-reduced-motion: reduce) {
      .photo-card-to-back {
        animation-duration: 1ms, 1ms;
        animation-delay: 0ms, 0ms;
      }
    }

    .bio-link {
      color: #0d9488;
      /* neuro-600 */
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
      text-decoration: none;
    }

    .bio-link:hover {
      color: #14b8a6;
      /* neuro-500 */
      animation: bio-glow 2s infinite ease-in-out;
    }

    /* Keep transparent funding logos legible when Dark Reader darkens the page. */
    html[data-darkreader-scheme="dark"] .funding-logo {
      filter: invert(1) hue-rotate(180deg);
      mix-blend-mode: lighten;
    }
  </style>
</head>
